# Unowire Nginx config — certbot-friendly single-block design
#
# FIRST DEPLOY: This config serves HTTP only (port 80 proxies to Next.js).
#   sudo cp deploy/nginx-unowire.conf /etc/nginx/sites-available/unowire
#   sudo ln -sf /etc/nginx/sites-available/unowire /etc/nginx/sites-enabled/unowire
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# AFTER DNS: Run `sudo certbot --nginx --redirect -d www.unowire.com -d unowire.com`
#   certbot will automatically:
#   - Add `listen 443 ssl` + SSL certificate paths to this server block
#   - Create a separate port-80 server block that redirects HTTP to HTTPS
#   The security headers (HSTS, X-Frame-Options, etc.) below will then apply
#   to HTTPS traffic automatically. No manual editing of this file is required.

server {
    listen 80;
    listen [::]:80;
    server_name www.unowire.com unowire.com;

    # Security hardening: hide nginx version
    server_tokens off;

    # HSTS (honored by browsers only over HTTPS; harmless over HTTP, active after certbot adds 443)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Certbot challenge path (for certificate issuance and renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Static asset caching (Next.js _next/static path)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # sitemap and robots
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy to Next.js PM2 process
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Upload size limit
    client_max_body_size 10m;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_proxied any;
}
