# Nginx reverse proxy for Unowire (www.unowire.com)
# Install: sudo cp deploy/nginx-unowire.conf /etc/nginx/sites-available/unowire
#          sudo ln -s /etc/nginx/sites-available/unowire /etc/nginx/sites-enabled/unowire
#          sudo nginx -t && sudo systemctl reload nginx

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name www.unowire.com unowire.com;

    # Certbot challenge path (for certificate issuance and renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.unowire.com unowire.com;

    # SSL certificate paths (fill in after Certbot issuance)
    # Comment out these two lines on first deploy; certbot --nginx will inject them automatically
    # ssl_certificate     /etc/letsencrypt/live/www.unowire.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.unowire.com/privkey.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static asset caching (Next.js _next/static path)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # sitemap and robots
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1h;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3000;
    }

    # Reverse proxy to Next.js PM2 process
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Upload size limit
    client_max_body_size 10m;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_proxied any;
}
