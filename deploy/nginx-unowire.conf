# Unowire Nginx config — two-phase SSL setup
#
# FIRST DEPLOY: This config serves HTTP only (port 80 proxies to Next.js).
#   sudo cp deploy/nginx-unowire.conf /etc/nginx/sites-available/unowire
#   sudo ln -sf /etc/nginx/sites-available/unowire /etc/nginx/sites-enabled/unowire
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# AFTER CERTBOT: Run `sudo certbot --nginx --redirect -d www.unowire.com -d unowire.com`
#   certbot will auto-configure SSL on the HTTP block and add a redirect.
#   Then uncomment the HTTPS block below for security headers + caching, and reload nginx.

# HTTP main site — proxies to Next.js (first deploy). After certbot --redirect,
# certbot rewrites this block to also listen on 443 ssl and redirects HTTP -> HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name www.unowire.com unowire.com;

    # Security hardening: hide nginx version
    server_tokens off;

    # Certbot challenge path (for certificate issuance and renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Static asset caching (Next.js _next/static path)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # sitemap and robots
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1h;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy to Next.js PM2 process
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Upload size limit
    client_max_body_size 10m;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_proxied any;
}

