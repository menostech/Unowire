# Development override file - NOT auto-merged by docker compose (renamed from docker-compose.override.yml).
# Must be used explicitly: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  frontend:
    build:
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: npm run dev

  backend:
    build:
      target: development
    volumes:
      - ./backend:/app
      - ./frontend/data:/frontend/data:ro  # expose taxonomy/cable JSON for seed.py
      - ./backend/media:/app/media  # local dev: write to host filesystem
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://unowire:unowire_dev@db:5432/unowire
      - DEBUG=true
      - JWT_SECRET=unowire-dev-jwt-secret-key-2026-change-in-production-32chars
      - ADMIN_EMAIL=admin@unowire.com
      - ADMIN_PASSWORD=admin123456
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=unowire_dev
